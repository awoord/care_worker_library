    <section class="panel" aria-labelledby="filterHeading">

      <form id="filterForm" class="search-form" action="#" method="get">

                <option value="31">31 （2019）</option>
                <option value="32">32 （2020）</option>
                <option value="33">33 （2021）</option>
                <option value="34">34 （2022）</option>
                <option value="35">35 （2023）</option>
                <option value="36">36 （2024）</option>
                <option value="37">37 （2025）</option>
                <option value="38" selected>38 （2026）</option>
              </select>
            </label>
            <span class="range-sep" aria-hidden="true">〜</span>
            <label class="range-field">
              <span class="range-subcap">終了</span>
              <select id="sessionTo" class="range-select session-select" name="to" aria-label="終了回">

                <option value="30">30 （2018）</option>
                <option value="31">31 （2019）</option>
                <option value="32">32 （2020）</option>

                <option value="35">35 （2023）</option>
                <option value="36">36 （2024）</option>
                <option value="37">37 （2025）</option>
                <option value="38" selected>38 （2026）</option>
              </select>
            </label>
          </div>
        </div>

        <label class="field-block">
          <span class="range-caption">科目</span>
          <select id="subjectSelect" class="range-select subject-select" name="subject" aria-label="科目">
            <option value="">すべての科目</option>
            <option value="人間の尊厳と自立">人間の尊厳と自立</option>
            <option value="介護の基本">介護の基本</option>
            <option value="社会の理解">社会の理解</option>
            <option value="人間関係とコミュニケーション">人間関係とコミュニケーション</option>

            <option value="障害の理解">障害の理解</option>
            <option value="医療的ケア">医療的ケア</option>
            <option value="介護過程">介護過程</option>
            <option value="総合問題">総合問題</option>
          </select>
        </label>

        <label class="field-block">
          <span class="range-caption">タイプ</span>
          <select id="typeSelect" class="range-select subject-select" name="type" aria-label="タイプ">
            <option value="">すべてのタイプ</option>
            <option value="正しいもの">正しいもの</option>
            <option value="適切なもの">適切なもの</option>
            <option value="最も適切なもの">最も適切なもの</option>
            <option value="そのほか">そのほか</option>
          </select>
        </label>

        <div class="field-block field-block-search">
          <label class="range-caption" for="searchInput">キーワード</label>
          <div class="search-row">
            <input id="searchInput" class="search-input" type="search" name="q" placeholder="例: 心臓　ICF" autocomplete="off" enterkeyhint="search">
            <button type="submit" class="search-button">検索</button>
          </div>
        </div>
      </form>
    </section>
